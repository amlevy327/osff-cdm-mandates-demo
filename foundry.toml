[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.29"           # matches EAS v1.9.0, which the tests deploy locally
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./cdm" }]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@eas/=lib/eas-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
